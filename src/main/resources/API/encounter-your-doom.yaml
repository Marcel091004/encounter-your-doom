openapi: 3.1.0
info:
  title: Encounter Your Doom API
  description: API for the Encounter Your Doom application.
  version: 0.0.1
servers:
  - url: 'http://localhost:8080/datev/v1'
paths:
  /creature:
    get:
      summary: Returns all creatures.
      operationId: getCreatures
      tags:
        - Creature
      parameters:
        - name: 'region'
          in: query
          required: false
          schema:
            type: enum
            $ref: '#/components/schemas/Region'
        - name: 'rarity'
          in: query
          required: false
          schema:
            type: enum
            $ref: '#/components/schemas/Rarity'
        - name: 'cr'
          in: query
          required: false
          schema:
            type: string
            description: 'Challenge Rating indicating the difficulty of the creature (1/8 up to 30).'

      responses:
        200:
          description: Successful response with all creatures.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Creature'
        400:
          description: Bad Request - e.g., due to /creature?region or /creature?rarity being too long.

    post:
      summary: Creates a new creature.
      operationId: createCreature
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Creature'
      tags:
        - Creature
      responses:
        201:
          description: Successfully created creature.
          headers:
            Location:
              description: URI of the newly created creature
              schema:
                type: string
                format: uri
              #TODO Hier weiter
        400:
          description: Bad Request - e.g., due to already existing creature.

  /creature/{id}:
    get:
      summary: Returns a creature based on its ID.
      operationId: getCreatureById
      tags:
        - Creature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Successful response with a creature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creature'
        400:
          description: Bad Request - e.g., due to invalid UUID format.

    put:
      summary: Updates a creature based on its ID.
      operationId: updateCreatureById
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Creature'
      tags:
        - Creature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Successfully updated creature.
        400:
          description: Bad Request - e.g., due to invalid UUID format.

  /creature/random:
    get:
      summary: Gets a random creature.
      operationId: getRandomCreature
      tags:
        - Creature
      parameters:
        - name: 'region'
          in: query
          required: false
          schema:
            type: enum
            $ref: '#/components/schemas/Region'
        - name: 'rarity'
          in: query
          required: false
          schema:
            type: enum
            $ref: '#/components/schemas/Rarity'
        - name: 'cr'
          in: query
          required: false
          schema:
            type: string
            description: 'Challenge Rating indicating the difficulty of the creature (1/8 up to 30).'

      responses:
        200:
          description: Successfully got a random creature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creature'

  /encounter:
    get:
      summary: Gets all public encounters.
      operationId: getAllPublicEncounters
      tags:
        - Encounter
      parameters:
        - name: 'region'
          in: query
          required: false
          schema:
            type: enum
            $ref: '#/components/schemas/Region'
        - name: 'rarity'
          in: query
          required: false
          schema:
            type: enum
            $ref: '#/components/schemas/Rarity'
        - name: 'difficultyLevel'
          in: query
          required: false
          schema:
            type: enum
            $ref: '#/components/schemas/DifficultyLevel'
        - name: 'partyLevel'
          in: query
          required: false
          schema:
            type: int
            description: 'Indicates the average level of the player party.'
      responses:
        200:
          description: Successfully got all Encounters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Encounter'

    post:
      summary: Creates a new encounter.
      operationId: createNewEncounter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Encounter'
      tags:
        - Encounter
      responses:
        201:
          description: Successfully created encounter.
          headers:
            Location:
              description: URI of the newly created encounter
              schema:
                type: string
                format: uri

  /encounter/{id}:
    get:
      summary: Gets a public encounter by its Id.
      operationId: getPublicEncounterById
      tags:
        - Encounter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Successfully got a Encounter by Id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encounter'
    put:
      summary: Update a public encounter by its Id.
      operationId: updatePublicEncounterById
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Encounter'
      tags:
        - Encounter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Successfully updated a Encounter by Id.

#TODO: Was ist hiermit?
  /encounter/{id}/{userid}/move:
    put:
      summary: Move a encounter to the privat userspace.
      operationId: moveEncounterToUserSpace
      tags:
        - Encounter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Successfully moved a encounter to the privat userspace.

  /encounter/random:
    get:
      summary: Gets a random encounter.
      operationId: getRandomEncounter
      tags:
        - Encounter
      parameters:
        - name: 'region'
          in: query
          required: false
          schema:
            type: enum
            $ref: '#/components/schemas/Region'
        - name: 'rarity'
          in: query
          required: false
          schema:
            type: enum
            $ref: '#/components/schemas/Rarity'
        - name: 'difficultyLevel'
          in: query
          required: false
          schema:
            type: enum
            $ref: '#/components/schemas/DifficultyLevel'
        - name: 'partyLevel'
          in: query
          required: false
          schema:
            type: int
            description: 'Indicates the average level of the player party.'
      responses:
        200:
          description: Successfully got a random encounter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encounter'

  /privateEncounter/{userid}:
    get:
      summary: Gets all encounters for a specific private userspace.
      operationId: getAllEncountersForUser
      tags:
        - privateEncounter
      parameters:
        - name: userid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Successfully got all encounters for the private userspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Encounter'
    post:
      summary: Creates a encounter for a specific private userspace.
      operationId: createEncounterForUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Encounter'
      tags:
        - privateEncounter
      parameters:
        - name: userid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        201:
          description: Successfully created encounter for the private userspace.
          headers:
            Location:
              description: URI of the newly created private Encounter
              schema:
                type: string
                format: uri

  #TODO: URL anpassen?
  /privateEncounter/{userid}/{id}:
    get:
      summary: Gets encounter for a specific private userspace.
      operationId: getEncounterForUser
      tags:
        - privateEncounter
      parameters:
        - name: userid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Successfully got encounter for the private userspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encounter'
    put:
      summary: Update encounter for a specific private userspace.
      operationId: updateEncounterForUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Encounter'
      tags:
        - privateEncounter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Successfully updated encounter for the private userspace.
    post:
      summary: Start an encounter for a specific private userspace.
      operationId: startEncounterForUser
      tags:
        - privateEncounter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Successfully started encounter for the private userspace.

  #TODO: AUch 201 als Status?
  /user/generation:
    post:
      summary: Generates a UUID to identify a user.
      operationId: generateUserId
      tags:
        - User
      responses:
        200:
          description: Successfully generated a user ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UUID'

  /activeEncounter/{userid}:
    get:
      summary: Gets the active encounter for a specific private userspace.
      operationId: getActiveEncounterForUser
      tags:
        - ActiveEncounter
      parameters:
        - name: userid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Successfully got the active encounter for the private userspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveEncounter'
    delete:
      summary: Closes the active encounter for a specific private userspace.
      operationId: closeActiveEncounterForUser
      tags:
        - ActiveEncounter
      parameters:
        - name: userid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Successfully closed the active encounter for the private userspace.

  /activeEncounter/{userid}/{creatureid}:
    put:
      summary: Updates a creature in the active encounter for a the active encounter.
      operationId: updateCreatureInActiveEncounterForUser
      tags:
        - ActiveEncounter
      parameters:
        - name: userid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: creatureid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: heal
          in: query
          required: false
          schema:
            type: int
        - name: damage
          in: query
          required: false
          schema:
            type: int
        - name: statusEffect
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StatusEffects'
      responses:
        204:
          description: Successfully updated creature in the active encounter for the private userspace.



components:
  schemas:

    UUID:
      type: string
      format: uuid
      example: "123e4567-e89b-12d3-a456-426614174000"

    Creature:
      type: object
      required:
        - name
        - initiative
        - HP
        - AC
        - statBlock
        - cr
        - attack
        - speed
      properties:
        Id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        initiative:
          type: integer
          example: 3
        name:
          type: string
          example: "Goblin"
          minLength: 2
          maxLength: 20
        HP:
          type: integer
          example: 30
          minimum: 1
          maximum: 1000
        AC:
          type: integer
          example: 15
          minimum: 0
          maximum: 30
        CreatureDescription:
          type: string
          example: "A small, green humanoid creature known for its mischievous nature."
          minLength: 5
          maxLength: 1000
        statBlock:
          $ref: '#/components/schemas/StatBlock'
        statusEffects:
          type: array
          items:
            example: [ "Poisoned", "Stunned" ]
            $ref: '#/components/schemas/StatusEffects'
        resistances:
          type: array
          items:
            example: [ "Fire", "Cold" ]
            $ref: '#/components/schemas/damageTypes'
        immunities:
          type: array
          items:
            example: [ "Poison", "Charm" ]
            $ref: '#/components/schemas/damageTypes'
        weaknesses:
          type: array
          items:
            example: [ "Radiant", "Psychic" ]
            $ref: '#/components/schemas/damageTypes'
        region:
          type: array
          items:
            $ref: '#/components/schemas/Region'
            example: "Forest"
        rarity:
          type: array
          items:
            $ref: '#/components/schemas/Rarity'
            example: "Common"
        cr:
          type: string
          example: "1/4"
          description: "Challenge Rating indicating the difficulty of the creature."
        Speed:
          type: integer
          example: 30
          description: "The movement speed of the creature in feet."
        traits:
          type: array
          items:
            type: string
          example: [ "Darkvision", "Pack Tactics" ]
          description: "Special traits or abilities of the creature."
        attack:
          type: array
          items:
            $ref: '#/components/schemas/Attack'

    Attack:
      type: object
      properties:
        name:
          type: string
          example: "Slash"
        attackBonus:
          type: integer
          example: 5
        damage:
          type: string
          example: "1d6 + 3 slashing"
        description:
          type: string
          example: "A quick slash with a sharp blade."
        damageType:
          type: array
          items:
            example: "Slashing"
            $ref: '#/components/schemas/damageTypes'

    StatBlock:
      type: object
      properties:
        Str:
          type: integer
          minimum: -5
          maximum: 5
        Dex:
          type: integer
          minimum: -5
          maximum: 5
        Con:
          type: integer
          minimum: -5
          maximum: 5
        Int:
          type: integer
          minimum: -5
          maximum: 5
        Wis:
          type: integer
          minimum: -5
          maximum: 5
        Cha:
          type: integer
          minimum: -5
          maximum: 5

    Encounter:
      type: object
      required:
        - name
        - difficultyLevel
        - description
      properties:
        name:
          type: string
          example: "Ambush in the Forest"
          minLength: 2
          maxLength: 100
        Id:
          type: string
          format: uuid
          example: "223e4567-e89b-12d3-a456-426614174000"
        creatures:
          type: array
          items:
            type: string
            format: uuid
          description: "List of creatures involved in the encounter."
        environment:
          $ref: '#/components/schemas/Region'
        partyLevel:
          type: integer
          example: 3
          description: "Indicates the average level of the player party."
        difficultyLevel:
          $ref: '#/components/schemas/DifficultyLevel'
          example: "Medium"
          description: "Indicates the overall difficulty level of the encounter."
        description:
          type: string
          example: "A group of goblins ambushes the party in a dense forest."
          minLength: 5
          maxLength: 1000
        reward:
          type: string
          example: "100 gold pieces and a magical sword."
          description: "Rewards for successfully completing the encounter."

    ActiveEncounter:
      type: object
      properties:
        encounter:
          $ref: '#/components/schemas/Encounter'
        creatures:
          type: array
          items:
            $ref: '#/components/schemas/Creature'

    DifficultyLevel:
      type: string
      enum:
        - Trivial
        - Easy
        - Medium
        - Hard
        - Deadly
    damageTypes:
      type: string
      enum:
        - Slashing
        - Piercing
        - Bludgeoning
        - Fire
        - Cold
        - Lightning
        - Acid
        - Poison
        - Psychic
        - Necrotic
        - Radiant
        - Thunder
        - Force
    StatusEffects:
      type: string
      enum:
        - Blinded
        - Charmed
        - Deafened
        - Frightened
        - Grappled
        - Incapacitated
        - Invisible
        - Paralyzed
        - Petrified
        - Poisoned
        - Prone
        - Restrained
        - Stunned
        - Unconscious
    Region:
      type: string
      enum:
        - Forest
        - Desert
        - Mountain
        - Swamp
        - Urban
        - Coastal
        - Arctic
        - Underground
        - Plains
        - Jungle
        - Hills
        - Volcanic
    Rarity:
      type: string
      enum:
        - Common
        - Uncommon
        - Rare
        - Very Rare
        - Legendary
        - Mythic
